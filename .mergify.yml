pull_request_rules:
  - name: vm2 two-review bot approval
    conditions:
      - author = livastic-vm2-secondary-20260911
      - base = main
      - label = VM2-TWO-REVIEW-TRIGGER
    actions:
      review:
        type: APPROVE
        message: VM2-TWO-REVIEW-BOT-APPROVAL
  - name: vm2 two-review owner approval
    conditions:
      - author = livastic-vm2-secondary-20260911
      - base = main
      - label = VM2-TWO-REVIEW-TRIGGER
    actions:
      review:
        type: APPROVE
        bot_account: livastic-vm2-primary-20260911
        message: VM2-TWO-REVIEW-OWNER-APPROVAL
  - name: vm2 two-review merge after two approvals
    conditions:
      - author = livastic-vm2-secondary-20260911
      - base = main
      - label = VM2-TWO-REVIEW-TRIGGER
      - "#approved-reviews-by >= 2"
    actions:
      merge:
        method: merge
